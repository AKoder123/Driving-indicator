<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Yousouf Status</title>
<link rel="manifest" href="manifest.json">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0b0f;
    color: #f2f2f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: background 0.4s;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 1.5rem;
    box-sizing: border-box;
    text-align: center;
  }
  body.driving { background: #1a0000; }
  body.arrived { background: #001a08; }
  #emoji { font-size: 6rem; line-height: 1; }
  #label { font-size: 2rem; font-weight: 700; }
  #label.driving { color: #ff3b30; animation: pulse 1.2s ease-in-out infinite; }
  #label.arrived { color: #34c759; }
  @keyframes pulse {
    0%, 100% { text-shadow: 0 0 10px rgba(255, 59, 48, 0.6); }
    50% { text-shadow: 0 0 28px rgba(255, 59, 48, 1); }
  }
  #updated { font-size: 1rem; color: #9a9aa5; }
  button, input {
    font-size: 1.25rem;
    padding: 0.9rem 1.2rem;
    border-radius: 0.75rem;
    border: none;
  }
  #toggleBtn {
    width: 90%;
    max-width: 22rem;
    background: #3a7bfd;
    color: white;
    font-weight: 700;
    cursor: pointer;
  }
  #toggleBtn:active { opacity: 0.8; }
  .hidden { display: none; }
</style>
</head>
<body>

  <div id="emoji">🚗</div>
  <div id="label">Loading...</div>
  <div id="updated"></div>

  <button id="toggleBtn" class="hidden">Toggle status</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getDatabase, ref, onValue, set, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  // ==================== FIREBASE CONFIG ====================
  // Fill in with your Firebase project's web config.
  const firebaseConfig = {
    apiKey: "AIzaSyB6TAwbmGWJBBxEkc8Ck0TlIhAG-53-sU0",
    authDomain: "driving-indicator.firebaseapp.com",
    databaseURL: "https://driving-indicator-default-rtdb.firebaseio.com", // TODO: verify once you create the Realtime Database
    projectId: "driving-indicator",
    storageBucket: "driving-indicator.firebasestorage.app",
    messagingSenderId: "873119963796",
    appId: "1:873119963796:web:ed829866bcd030ed0e7281"
  };
  // ===========================================================

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const statusRef = ref(db, "status");

  const emojiEl = document.getElementById("emoji");
  const labelEl = document.getElementById("label");
  const updatedEl = document.getElementById("updated");
  const toggleBtn = document.getElementById("toggleBtn");

  let currentDriving = false;

  onValue(statusRef, (snap) => {
    const data = snap.val() || { driving: false, updatedAt: null };
    currentDriving = !!data.driving;
    emojiEl.textContent = currentDriving ? "🚗" : "🅿️";
    labelEl.textContent = currentDriving ? "Yousouf on the road" : "Arrived — safe";
    labelEl.classList.toggle("driving", currentDriving);
    labelEl.classList.toggle("arrived", !currentDriving);
    document.body.classList.toggle("driving", currentDriving);
    document.body.classList.toggle("arrived", !currentDriving);
    updatedEl.textContent = data.updatedAt ? "updated " + timeAgo(data.updatedAt) + " ago" : "";
  });

  setInterval(() => {
    // re-render the "X min ago" text on a tick, re-reading last known value
    onValue(statusRef, (snap) => {
      const data = snap.val();
      if (data && data.updatedAt) {
        updatedEl.textContent = "updated " + timeAgo(data.updatedAt) + " ago";
      }
    }, { onlyOnce: true });
  }, 30000);

  function timeAgo(ts) {
    const seconds = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (seconds < 60) return seconds + "s";
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return minutes + "m";
    const hours = Math.floor(minutes / 60);
    return hours + "h";
  }

  const isAdmin = new URLSearchParams(location.search).has("admin");

  if (isAdmin) {
    toggleBtn.classList.remove("hidden");

    toggleBtn.addEventListener("click", () => {
      set(statusRef, { driving: !currentDriving, updatedAt: serverTimestamp() });
    });
  }
</script>
</body>
</html>
